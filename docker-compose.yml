services:
  filament:
    build:
      context: .
    image: dereibims/spooltrack:latest
    container_name: spool-manager
    ports:
      - "8080:80"
    environment:
      APP_LANG: "en"
    volumes:
      - ./data:/srv/backend/data
    restart: unless-stopped


x-bake:
  targets:
    filament:
      tags:
        - dereibims/spooltrack:latest
      platforms:
        - linux/amd64
        - linux/arm64
        - linux/arm/v7

    
